<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Calendar</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --ink: #14161a; --muted: #6b7280; --line: #e5e7eb;
  --accent: #2563eb; --done: #16a34a; --miss: #dc2626; --today: #eef4ff;
  --z1: #9ca3af; --z2: #3b82f6; --z3: #22c55e; --z4: #eab308; --z5: #f97316; --z6: #ef4444; --z7: #a855f7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --card: #181b21; --ink: #e8eaee; --muted: #9aa1ad; --line: #2a2f38;
    --accent: #60a5fa; --done: #4ade80; --miss: #f87171; --today: #1b2433;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
header { position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: 12px 16px 8px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 20px; margin: 0; flex: 1; }
header .sub { font-size: 13px; color: var(--muted); font-weight: 400; }
button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 10px; padding: 8px 12px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; width: 100%; padding: 12px; }
main { max-width: 680px; margin: 0 auto; padding: 8px 16px 40px; }
.week { margin: 18px 0 6px; display: flex; justify-content: space-between; align-items: baseline; }
.week h2 { font-size: 15px; margin: 0; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.week .tot { font-size: 13px; color: var(--muted); }
.day { display: flex; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.day.today { background: var(--today); margin: 0 -16px; padding: 8px 16px; border-radius: 8px; }
.date { width: 44px; flex: none; text-align: center; }
.date .dow { font-size: 12px; color: var(--muted); text-transform: uppercase; }
.date .dn { font-size: 20px; font-weight: 600; }
.sessions { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.rest { color: var(--muted); font-size: 14px; padding-top: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.card .t { font-weight: 600; font-size: 15px; display: flex; gap: 6px; align-items: flex-start; }
.card .t span { flex: 1; }
.meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
.badge { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
.badge.done { color: var(--done); border: 1px solid var(--done); }
.badge.part { color: var(--z5); border: 1px solid var(--z5); }
.badge.miss { color: var(--miss); border: 1px solid var(--miss); }
svg.prof { display: block; width: 100%; height: 44px; margin-top: 8px; }
.detail { display: none; margin-top: 10px; font-size: 14px; }
.card.open .detail { display: block; }
.card.open svg.prof { height: 90px; }
.note { white-space: pre-wrap; margin: 0 0 10px; }
.ride { background: var(--bg); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
td { padding: 3px 4px; border-top: 1px solid var(--line); vertical-align: top; }
td.n { text-align: right; white-space: nowrap; }
td .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
.login { max-width: 360px; margin: 60px auto; padding: 0 16px; }
.login h1 { font-size: 24px; }
.login input { width: 100%; font: inherit; padding: 12px; margin: 6px 0; border-radius: 10px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.err { color: var(--miss); font-size: 14px; min-height: 20px; }
.center { text-align: center; color: var(--muted); padding: 40px 0; }
.more { display: block; width: 100%; margin-top: 16px; }

/* Header tabs */
header .sub { flex: 1; text-align: right; padding-right: 4px; }
.tabs { display: flex; background: var(--line); border-radius: 10px; padding: 2px; }
.tabs button { border: 0; background: none; padding: 6px 14px; border-radius: 8px; color: var(--muted); font-weight: 600; }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.15); }

/* Fitness view */
:root { --s1: #2a78d6; --s2: #eb6834; --ref: #9a9890; }
@media (prefers-color-scheme: dark) { :root { --s1: #3987e5; --s2: #d95926; --ref: #6f6d66; } }
.perf section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 14px; }
.perf h3 { margin: 0; font-size: 16px; }
.perf section > .meta { margin: 2px 0 8px; }
.seg { display: flex; gap: 6px; margin-top: 12px; }
.seg button { flex: 1; padding: 6px 0; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.tl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.tv { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tv small { font-size: 13px; font-weight: 500; color: var(--muted); }
.ts { font-size: 12px; color: var(--muted); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin-top: 10px; }
.kv .tv { font-size: 18px; }
.chart svg { display: block; touch-action: pan-y; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .ln.s1 { stroke: var(--s1); }
.chart .ln.ref { stroke: var(--ref); stroke-dasharray: 5 4; }
.chart .bar { fill: var(--s1); }
.chart .dot { fill: var(--s1); stroke: var(--card); stroke-width: 2; }
.chart .refl { stroke: var(--muted); stroke-dasharray: 4 4; }
.chart .xh { stroke: var(--muted); stroke-width: 1; }
.chart .ring { fill: none; stroke: var(--ink); stroke-width: 2; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
#tip { position: fixed; display: none; z-index: 20; pointer-events: none; max-width: 260px; background: var(--card); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.zones { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.zr { display: grid; grid-template-columns: 118px 1fr 58px 38px; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.zl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.zl .meta { font-weight: 400; }
.zb { height: 10px; }
.zb i { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 0; }
.zv, .zp { text-align: right; }
.zp { color: var(--muted); }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.rt { min-width: 560px; }
.rt th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 3px 4px; }
.rt th.n { text-align: right; }
.rt td.nm { max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grp { font-size: 17px; margin: 26px 0 0; }
.grp .meta { font-weight: 400; font-size: 13px; }
.chart .ln.s2 { stroke: var(--s2); }
.chart .ln.k { stroke: var(--ink); stroke-width: 1.5; opacity: .85; }
.chart .dot.k { fill: var(--ink); stroke: var(--card); stroke-width: 1.5; }
.chart .dl { fill: var(--ink); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chart .band { opacity: .14; }
.chart .bl { fill: var(--muted); font-size: 10px; }
.f-tr { fill: #eda100; } .f-fr { fill: #2a78d6; } .f-gr { fill: #888; } .f-op { fill: #16a34a; } .f-hr { fill: #e34948; }
.foot { font-size: 12px; color: var(--muted); margin-top: 16px; }
</style>
</head>
<body>
<div id="app"><div class="center">Loading…</div></div>
<script>
"use strict";
// Supabase project of the TrainerApp. The publishable key is a client key, meant to be public:
// row-level security means a signed-in user only ever sees their own rows.
const SB_URL = "https://tciawvasdfymnsfjrork.supabase.co";
const SB_KEY = "sb_publishable_4p_7w7o37W-T586s5EcJSw_w2-4iSFY";
const STORE = "tc.session";

const app = document.getElementById("app");
let session = null, scrolled = false, ftp = 250, weeksBack = 1, weeksAhead = 6;
const openCards = new Set();

const store = {
  get() { try { return JSON.parse(localStorage.getItem(STORE)); } catch { return null; } },
  set(v) { try { v ? localStorage.setItem(STORE, JSON.stringify(v)) : localStorage.removeItem(STORE); } catch {} },
};
const ui = {
  get(k) { try { return localStorage.getItem(`tc.${k}`); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(`tc.${k}`, v); } catch {} },
};
let view = ui.get("view") === "perf" ? "perf" : "plan";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- Auth ----------
async function auth(grant, body) {
  const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=${grant}`, {
    method: "POST", headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || `HTTP ${r.status}`);
  return { access: j.access_token, refresh: j.refresh_token, exp: Math.floor(Date.now() / 1000) + (j.expires_in || 3600) };
}
async function token() {
  if (!session) throw new Error("signed out");
  if (session.exp - 60 < Date.now() / 1000) { session = await auth("refresh_token", { refresh_token: session.refresh }); store.set(session); }
  return session.access;
}
async function rest(path) {
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, { headers: { apikey: SB_KEY, Authorization: `Bearer ${await token()}` } });
  if (r.status === 401) { signOut(); throw new Error("Session expired"); }
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}
function signOut() { session = null; store.set(null); renderLogin(); }

function renderLogin(msg = "") {
  app.innerHTML = `<form class="login" id="f">
    <h1>Training Calendar</h1>
    <p class="meta">Sign in with your TrainerApp account.</p>
    <input id="e" type="email" autocomplete="username" placeholder="Email" required>
    <input id="p" type="password" autocomplete="current-password" placeholder="Password" required>
    <div class="err" id="err">${esc(msg)}</div>
    <button class="primary" type="submit">Sign in</button></form>`;
  document.getElementById("f").onsubmit = async ev => {
    ev.preventDefault();
    const err = document.getElementById("err"); err.textContent = "Signing in…";
    try {
      session = await auth("password", { email: document.getElementById("e").value.trim(), password: document.getElementById("p").value });
      store.set(session); load();
    } catch (e) { err.textContent = /invalid/i.test(e.message) ? "Wrong email or password" : e.message; }
  };
}

// ---------- Dates ----------
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const monday = d => addDays(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -((d.getDay() + 6) % 7));
const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function weekNo(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / 864e5 + 1) / 7); }
const hm = s => { s = Math.round(s / 60); const h = Math.floor(s / 60), m = s % 60; return h ? `${h}:${String(m).padStart(2, "0")} h` : `${m} min`; };
const mmss = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;

// ---------- Workout maths ----------
const frac = p => (p <= 4 ? p : p / ftp);   // ≤ 4 = fraction of FTP, else watts
function zoneColor(f) {
  const z = f <= .55 ? 1 : f <= .75 ? 2 : f <= .90 ? 3 : f <= 1.05 ? 4 : f <= 1.20 ? 5 : f <= 1.50 ? 6 : 7;
  return `var(--z${z})`;
}
// Segments [{t0, dur, f0, f1, note}] with ramps resolved.
function segments(w) {
  if (!Array.isArray(w.intervals)) return [];
  let t = 0, prev = .5; const out = [];
  for (const iv of w.intervals) {
    const f1 = frac(Number(iv.power) || 0), f0 = iv.type === "ramp" ? prev : f1, dur = Number(iv.duration) || 0;
    out.push({ t0: t, dur, f0, f1, note: iv.note || "", ramp: iv.type === "ramp", cad: Number(iv.cadence) || null });
    t += dur; prev = f1;
  }
  return out;
}
function stats(w) {
  const seg = segments(w);
  if (!seg.length) return { dur: w.duration_s || 0, tss: null, iF: null };
  let dur = 0, p4 = 0;
  for (const s of seg) {           // integrate f^4 (ramps: average over 8 sub-steps)
    const n = s.ramp ? 8 : 1;
    for (let i = 0; i < n; i++) { const f = s.f0 + (s.f1 - s.f0) * (i + .5) / n; p4 += f ** 4 * s.dur / n; }
    dur += s.dur;
  }
  const iF = dur ? (p4 / dur) ** .25 : 0;
  return { dur, iF, tss: dur * iF * iF / 36 };
}
function profile(w) {
  const seg = segments(w), W = 1000, H = 100;
  if (!seg.length) {
    if (!w.hr_cap) return "";
    return `<svg class="prof" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <rect x="0" y="${H * .45}" width="${W}" height="${H * .55}" fill="var(--z2)" opacity=".35"/>
      <line x1="0" x2="${W}" y1="${H * .45}" y2="${H * .45}" stroke="var(--z2)" stroke-width="3" stroke-dasharray="12 8" vector-effect="non-scaling-stroke"/></svg>`;
  }
  const total = seg.reduce((a, s) => a + s.dur, 0), top = Math.max(1.25, ...seg.map(s => Math.max(s.f0, s.f1))) * 1.05;
  const x = t => t / total * W, y = f => H - f / top * H;
  const shapes = seg.map(s => `<polygon fill="${zoneColor(Math.max(s.f0, s.f1))}" points="${x(s.t0)},${H} ${x(s.t0)},${y(s.f0)} ${x(s.t0 + s.dur)},${y(s.f1)} ${x(s.t0 + s.dur)},${H}"/>`).join("");
  return `<svg class="prof" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${shapes}
    <line x1="0" x2="${W}" y1="${y(1)}" y2="${y(1)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/></svg>`;
}
function intervalTable(w) {
  const seg = segments(w); if (!seg.length) return "";
  // Merge identical consecutive steps for readability.
  const rows = [];
  for (const s of seg) {
    const last = rows[rows.length - 1];
    if (last && !s.ramp && !last.ramp && last.f1 === s.f1 && last.cad === s.cad && !s.note) { last.dur += s.dur; continue; }
    rows.push({ ...s });
  }
  return `<table>${rows.map(s => {
    const w0 = Math.round(s.f0 * ftp), w1 = Math.round(s.f1 * ftp);
    const watts = s.ramp && w0 !== w1 ? `${w0}→${w1} W` : `${w1} W`;
    const pct = s.ramp && w0 !== w1 ? `${Math.round(s.f0 * 100)}→${Math.round(s.f1 * 100)} %` : `${Math.round(s.f1 * 100)} %`;
    return `<tr><td class="n">${mmss(s.t0)}</td><td class="n">${mmss(s.dur)}</td>
      <td class="n"><span class="sw" style="background:${zoneColor(Math.max(s.f0, s.f1))}"></span>${watts}</td>
      <td class="n">${pct}</td><td class="n">${s.cad ? `${s.cad} rpm` : ""}</td><td>${esc(s.note)}</td></tr>`;
  }).join("")}</table>`;
}

// ---------- Render ----------
function card(w, ride, today) {
  const st = stats(w), key = w.id;
  const bits = [];
  if (st.dur) bits.push(hm(st.dur));
  if (w.hr_cap) bits.push(`HR cap ${w.hr_cap}`);
  if (st.tss != null) bits.push(`~${Math.round(st.tss)} TSS · IF ${st.iF.toFixed(2)}`);
  if (!st.dur && !w.hr_cap) bits.push("Note");
  let badge = "";
  if (ride) badge = ride.completed === false ? `<span class="badge part">Stopped</span>` : `<span class="badge done">✓ Done</span>`;
  else if (w.date < today && (st.dur || w.hr_cap)) badge = `<span class="badge miss">Not ridden</span>`;
  const rideBox = ride ? `<div class="ride"><b>Ridden</b> ${new Date(ride.started_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })} ·
      ${hm(ride.duration_s)}${ride.tss != null ? ` · ${Math.round(ride.tss)} TSS` : ""}${ride.normalized_power ? ` · NP ${ride.normalized_power} W` : ""}
      ${ride.intensity_factor ? ` · IF ${Number(ride.intensity_factor).toFixed(2)}` : ""}${ride.avg_hr ? ` · HR ${ride.avg_hr}` : ""}
      ${ride.decoupling_pct != null ? ` · Pw:HR ${Number(ride.decoupling_pct).toFixed(1)} %` : ""}</div>` : "";
  return `<div class="card${openCards.has(key) ? " open" : ""}" data-k="${esc(key)}">
    <div class="t"><span>${esc(w.name)}</span>${badge}</div>
    <div class="meta">${bits.join(" · ")}</div>
    ${profile(w)}
    <div class="detail">${rideBox}${w.note ? `<p class="note">${esc(w.note)}</p>` : ""}${intervalTable(w)}</div>
  </div>`;
}

async function load() {
  if (view === "perf") return loadPerf();
  const start = addDays(monday(new Date()), -7 * weeksBack), end = addDays(monday(new Date()), 7 * weeksAhead);
  app.innerHTML = `<div class="center">Loading…</div>`;
  try {
    const [ath, plan, rides] = await Promise.all([
      rest("athlete?select=ftp"),
      rest(`planned_workouts?select=id,date,name,note,intervals,hr_cap,duration_s&date=gte.${iso(start)}&date=lt.${iso(end)}&order=date,id`),
      rest(`rides?select=id,started_at,name,duration_s,completed,plan_id,tss,intensity_factor,normalized_power,avg_hr,decoupling_pct&started_at=gte.${iso(addDays(start, -1))}&order=started_at`),
    ]);
    if (ath[0]?.ftp) ftp = ath[0].ftp;
    render(start, end, plan, rides);
  } catch (e) {
    if (session) app.innerHTML = `<div class="center">Could not load: ${esc(e.message)}<br><br><button onclick="load()">Retry</button></div>`;
  }
}

function render(start, end, plan, rides) {
  const today = iso(new Date());
  const byPlan = new Map(rides.filter(r => r.plan_id).map(r => [r.plan_id, r]));
  const byDate = new Map();
  for (const w of plan) { if (!byDate.has(w.date)) byDate.set(w.date, []); byDate.get(w.date).push(w); }
  // Sort same-day sessions: "part 1" before "part 2", otherwise by name.
  for (const l of byDate.values()) l.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

  let html = `${headerHtml()}<main>`;
  if (weeksBack < 8) html += `<button class="more" id="older">Show earlier weeks</button>`;
  for (let wk = new Date(start); wk < end; wk = addDays(wk, 7)) {
    let secs = 0, tss = 0, days = "";
    for (let i = 0; i < 7; i++) {
      const d = addDays(wk, i), ds = iso(d), list = byDate.get(ds) || [];
      for (const w of list) { const s = stats(w); secs += s.dur; tss += s.tss || 0; }
      days += `<div class="day${ds === today ? " today" : ""}"${ds === today ? ' id="today"' : ""}>
        <div class="date"><div class="dow">${DOW[i]}</div><div class="dn">${d.getDate()}</div></div>
        <div class="sessions">${list.length ? list.map(w => card(w, byPlan.get(w.id), today)).join("") : `<div class="rest">—</div>`}</div></div>`;
    }
    const last = addDays(wk, 6);
    html += `<div class="week"><h2>W${weekNo(wk)} · ${wk.getDate()} ${MON[wk.getMonth()]} – ${last.getDate()} ${MON[last.getMonth()]}</h2>
      <span class="tot">${secs ? `${hm(secs)}${tss ? ` · ~${Math.round(tss)} TSS` : ""}` : ""}</span></div>${days}`;
  }
  html += `<button class="more" id="newer">Show later weeks</button></main>`;
  app.innerHTML = html;

  app.querySelectorAll(".card").forEach(c => c.onclick = () => {
    c.classList.toggle("open");
    c.classList.contains("open") ? openCards.add(c.dataset.k) : openCards.delete(c.dataset.k);
  });
  wireHeader();
  document.getElementById("newer").onclick = () => { weeksAhead += 4; load(); };
  const older = document.getElementById("older");
  if (older) older.onclick = () => { weeksBack += 4; load(); };
  if (!scrolled) { scrolled = true; document.getElementById("today")?.scrollIntoView({ block: "center" }); }
}

// ---------- Header / tabs ----------
function headerHtml() {
  return `<header>
    <div class="tabs" role="tablist">
      <button role="tab" data-v="plan" aria-selected="${view === "plan"}">Plan</button>
      <button role="tab" data-v="perf" aria-selected="${view === "perf"}">Fitness</button>
    </div>
    <span class="sub">FTP ${ftp} W</span>
    <button id="rf" aria-label="Refresh">↻</button><button id="so" aria-label="Sign out">⎋</button></header>`;
}
function wireHeader() {
  app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
    if (b.dataset.v === view) return;
    view = b.dataset.v; scrolled = false; ui.set("view", view); window.scrollTo(0, 0); load();
  });
  document.getElementById("rf").onclick = load;
  document.getElementById("so").onclick = () => { if (confirm("Sign out?")) signOut(); };
}

// ---------- Fitness view ----------
const RANGES = [["28", "4 wk"], ["91", "3 mo"], ["365", "1 yr"], ["all", "All"]];
const CURVE_D = [5, 15, 30, 60, 120, 300, 600, 1200, 1800, 3600, 5400, 7200, 10800, 14400];
const durLabel = s => s < 60 ? `${s}s` : s < 3600 ? `${s / 60}m` : `${s / 3600}h`;
const durLong = s => s < 60 ? `${s} s` : s < 3600 ? `${s / 60} min` : `${s / 3600} h`;
const dmy = d => `${d.getDate()} ${MON[d.getMonth()]}`;
let perfData = null;

async function loadPerf() {
  app.innerHTML = `<div class="center">Loading…</div>`;
  try {
    const [ath, rides, fit] = await Promise.all([
      rest("athlete?select=ftp,mass_kg"),
      rest("rides?select=id,started_at,name,duration_s,completed,ftp,tss,intensity_factor,normalized_power,avg_watts,avg_hr,efficiency,decoupling_pct,zones,power_curve&order=started_at"),
      rest("daily_fitness?select=date,ctl,atl,ramp,load,eftp,resting_hr,hrv,sleep_s&order=date").catch(() => []),
    ]);
    if (ath[0]?.ftp) ftp = ath[0].ftp;
    perfData = { mass: Number(ath[0]?.mass_kg) || null, rides: rides.map(r => ({ ...r, d: new Date(r.started_at) })),
      fit: fit.map(f => { const [y, m, d] = f.date.split("-").map(Number); return { ...f, d: new Date(y, m - 1, d) }; }) };
    renderPerf();
  } catch (e) {
    if (session) app.innerHTML = `${headerHtml()}<div class="center">Could not load: ${esc(e.message)}<br><br><button onclick="load()">Retry</button></div>`, wireHeader();
  }
}

function renderPerf() {
  const { rides: all, mass, fit: fitAll } = perfData, range = ui.get("range") || "91";
  const first = [all[0]?.d, fitAll[0]?.d].filter(Boolean).sort((a, b) => a - b)[0];
  const now = new Date(), from = range === "all" ? (first || now) : addDays(new Date(now.getFullYear(), now.getMonth(), now.getDate()), -Number(range) + 1);
  const rides = all.filter(r => r.d >= from), fit = fitAll.filter(f => f.d >= from);

  // Best power per duration (and which ride set it), in range and all-time.
  const best = list => {
    const m = new Map();
    for (const r of list) for (const [k, v] of Object.entries(r.power_curve || {})) {
      const d = Number(k); if (!(v > 0)) continue;
      if (!m.has(d) || v > m.get(d).w) m.set(d, { w: v, r });
    }
    return m;
  };
  const bRange = best(rides), bAll = best(all);
  const b20 = bRange.get(1200)?.w, eftp = b20 ? Math.round(b20 * .95) : null;
  const secs = rides.reduce((a, r) => a + (r.duration_s || 0), 0), tss = rides.reduce((a, r) => a + (Number(r.tss) || 0), 0);

  let h = `${headerHtml()}<main class="perf">
    <div class="seg" role="group" aria-label="Date range">${RANGES.map(([v, l]) => `<button data-r="${v}" aria-pressed="${v === range}">${l}</button>`).join("")}</div>
    ${fitnessHtml(fit)}
    <h2 class="grp">Indoor rides <span class="meta">TrainerApp</span></h2>
    <div class="tiles">
      ${tile("Rides", rides.length)}
      ${tile("Time", secs ? hm(secs) : "–")}
      ${tile("Load", tss ? `${Math.round(tss)} <small>TSS</small>` : "–")}
      ${tile("eFTP", eftp ? `${eftp} <small>W</small>` : "–", eftp ? `95 % of 20-min best${mass ? ` · ${(eftp / mass).toFixed(2)} W/kg` : ""}` : "needs a 20-min effort")}
    </div>`;
  if (!rides.length) {
    h += `<div class="center">No TrainerApp rides in this range.</div></main>`;
  } else {
    h += section("Power curve", "Best average power by duration, trainer scale", `<div class="chart" id="c-curve"></div>${legend(range !== "all" && [["var(--s1)", "This range"], ["var(--ref)", "All-time", true]])}${curveTable(bRange, mass)}`);
    h += section("Weekly load", "TSS per week (TrainerApp rides only)", `<div class="chart" id="c-load"></div>`);
    h += section("Aerobic efficiency", "Efficiency factor = NP ÷ avg HR. Higher at the same HR = fitter.", `<div class="chart" id="c-ef"></div>`);
    h += section("Pw:HR decoupling", "HR drift in the 2nd half vs the 1st. Under 5 % = good aerobic durability (meaningful on steady rides).", `<div class="chart" id="c-dec"></div>`);
    h += section("Time in zones", "Power zones, % of FTP", zonesHtml(rides));
    h += section("Rides", "", ridesTable(rides));
    h += `<p class="foot">Ride figures: indoor TrainerApp rides only. Fitness, fatigue, form, resting HR and HRV: all activities, copied from intervals.icu at each coach check-in${fitAll.length ? ` (last: ${dmy(fitAll[fitAll.length - 1].d)})` : ""}.</p></main>`;
  }
  app.innerHTML = h + `<div id="tip" role="tooltip"></div>`;
  wireHeader();
  app.querySelectorAll(".seg button").forEach(b => b.onclick = () => { ui.set("range", b.dataset.r); renderPerf(); });
  if (fit.length) fitnessCharts(fit, from);
  if (!rides.length) return;

  const W = document.getElementById("c-curve").clientWidth;
  curveChart(document.getElementById("c-curve"), W, bRange, range !== "all" ? bAll : null, mass);
  loadChart(document.getElementById("c-load"), W, rides, from);
  dotChart(document.getElementById("c-ef"), W, rides.filter(r => r.efficiency > 0), from, r => Number(r.efficiency), v => v.toFixed(2), null);
  dotChart(document.getElementById("c-dec"), W, rides.filter(r => r.decoupling_pct != null), from, r => Number(r.decoupling_pct), v => `${v.toFixed(1)} %`, 5);
}

// ----- Fitness / fatigue / form (intervals.icu snapshot) -----
const FORM_BANDS = [[25, 60, "Transition", "f-tr"], [5, 25, "Fresh", "f-fr"], [-10, 5, "Grey zone", "f-gr"], [-30, -10, "Optimal", "f-op"], [-80, -30, "High risk", "f-hr"]];
const formOf = f => f.ctl != null && f.atl != null ? f.ctl - f.atl : null;
const formZone = v => FORM_BANDS.find(([lo, hi]) => v >= lo && v < hi)?.[2] || "";
const n1 = v => v == null ? "–" : (Math.round(v * 10) / 10).toString();

function fitnessHtml(fit) {
  if (!fit.length) return "";
  const last = fit[fit.length - 1], form = formOf(last);
  const sign = v => v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(Math.round(v));
  return `<div class="tiles">
      ${tile("Fitness", Math.round(last.ctl), "CTL")}
      ${tile("Fatigue", Math.round(last.atl), "ATL")}
      ${tile("Form", sign(form), formZone(form))}
      ${tile("Ramp", last.ramp == null ? "–" : (last.ramp > 0 ? "+" : "") + n1(last.ramp), "CTL change / week")}
    </div>`
    + section("Fitness & fatigue", "Training load from all activities (intervals.icu)",
      `<div class="chart" id="c-pmc"></div>${legend([["var(--s1)", "Fitness (CTL)"], ["var(--s2)", "Fatigue (ATL)"]])}`)
    + section("Form", "Fitness − fatigue. Optimal training zone is −10 to −30.", `<div class="chart" id="c-form"></div>`)
    + (fit.some(f => f.resting_hr) ? section("Resting heart rate", "bpm, from Garmin. A rise of 5+ bpm = back off.", `<div class="chart" id="c-rhr"></div>`) : "")
    + (fit.some(f => f.hrv) ? section("HRV", "ms, from Garmin. Higher = better recovered.", `<div class="chart" id="c-hrv"></div>`) : "");
}

function fitnessCharts(fit, from) {
  const W = document.getElementById("c-pmc").clientWidth;
  const tipDay = f => { const fm = formOf(f);
    return `<b>${dmy(f.d)}</b><br>Fitness ${n1(f.ctl)} · Fatigue ${n1(f.atl)}<br>Form ${n1(fm)} <span class="meta">${formZone(fm)}</span>`
      + `${f.load ? `<br>Load ${Math.round(f.load)}` : ""}${f.ramp != null ? ` · Ramp ${n1(f.ramp)}` : ""}`; };
  timeChart(document.getElementById("c-pmc"), W, 190, fit, from,
    [{ v: f => f.ctl, cls: "s1", lab: "CTL" }, { v: f => f.atl, cls: "s2", lab: "ATL" }], { zero: true, tip: tipDay });
  timeChart(document.getElementById("c-form"), W, 150, fit, from,
    [{ v: formOf, cls: "k", lab: "" }], { zero: true, bands: FORM_BANDS, tip: tipDay });
  const rhr = document.getElementById("c-rhr"), hrv = document.getElementById("c-hrv");
  if (rhr) timeChart(rhr, W, 130, fit.filter(f => f.resting_hr), from, [{ v: f => f.resting_hr, cls: "k", lab: "" }], { dots: true,
    tip: f => `<b>${dmy(f.d)}</b><br>Resting HR ${f.resting_hr} bpm` });
  if (hrv) timeChart(hrv, W, 130, fit.filter(f => f.hrv), from, [{ v: f => Number(f.hrv), cls: "k", lab: "" }], { dots: true,
    tip: f => `<b>${dmy(f.d)}</b><br>HRV ${Math.round(f.hrv)} ms` });
}

// Time-series line chart. series: [{v(row), cls, lab}] — all on one y-axis.
function timeChart(el, W, H, rows, from, series, o = {}) {
  if (!rows.length) { el.innerHTML = `<p class="meta">No data.</p>`; return; }
  const vals = rows.flatMap(r => series.map(s => s.v(r))).filter(v => v != null);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (o.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  if (!o.zero) { const p = (hi - lo) * .15 || 2; lo -= p; hi += p; }
  const yt = niceTicks(lo, hi);
  const right = series.some(s => s.lab) ? 34 : PAD.r;
  const t0 = +from, t1 = Math.max(+rows[rows.length - 1].d, t0 + 864e5);
  const x = t => PAD.l + 4 + (t - t0) / (t1 - t0) * (W - PAD.l - right - 4);
  const y0 = yt[0], y1 = yt[yt.length - 1], y = v => PAD.t + (1 - (v - y0) / (y1 - y0)) * (H - PAD.t - PAD.b);
  const n = Math.max(2, Math.floor((W - PAD.l) / 70));
  const xt = Array.from({ length: n }, (_, i) => { const t = t0 + (t1 - t0) * i / (n - 1); return [x(t), dmy(new Date(t))]; });
  const bands = (o.bands || []).map(([a, b, lab, cls]) => {
    const top = y(Math.min(b, y1)), bot = y(Math.max(a, y0));
    if (bot - top < 1) return "";
    return `<rect class="band ${cls}" x="${PAD.l}" width="${W - PAD.l - PAD.r}" y="${top}" height="${bot - top}"/>`
      + (bot - top > 13 ? `<text class="bl" x="${PAD.l + 4}" y="${top + 12}">${lab}</text>` : "");
  }).join("");
  // End-of-line value labels, nudged apart when they would collide.
  const labs = series.map(s => { const last = [...rows].reverse().find(r => s.v(r) != null);
    return s.lab && last ? { x: x(+last.d) + 6, y: y(s.v(last)) + 4, t: Math.round(s.v(last)) } : null; });
  const ls = labs.filter(Boolean).sort((a, b) => a.y - b.y);
  for (let i = 1; i < ls.length; i++) if (ls[i].y - ls[i - 1].y < 13) { const m = (ls[i].y + ls[i - 1].y) / 2; ls[i - 1].y = m - 6.5; ls[i].y = m + 6.5; }
  const lines = series.map((s, si) => {
    let d = "", pen = false;
    for (const r of rows) { const v = s.v(r); if (v == null) { pen = false; continue; }
      d += `${pen ? "L" : "M"}${x(+r.d).toFixed(1)},${y(v).toFixed(1)}`; pen = true; }
    const dots = o.dots ? rows.map(r => s.v(r) == null ? "" : `<circle class="dot ${s.cls}" cx="${x(+r.d)}" cy="${y(s.v(r))}" r="3"/>`).join("") : "";
    const L = labs[si], lab = L ? `<text class="dl ${s.cls}" x="${L.x}" y="${L.y}">${L.t}</text>` : "";
    return `<path class="ln ${s.cls}" d="${d}"/>${dots}${lab}`;
  }).join("");
  const zero = o.zero && y0 < 0 ? `<line class="refl" x1="${PAD.l}" x2="${W - PAD.r}" y1="${y(0)}" y2="${y(0)}"/>` : "";
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">${bands}
    ${frame(W, H, yt, y, v => v, xt)}${zero}${lines}<g class="hl"></g></svg>`;
  attachHover(el, el.querySelector("svg"), H, rows.map(r => ({ x: x(+r.d),
    ys: series.map(s => s.v(r)).filter(v => v != null).map(y), html: o.tip(r) })), "line");
}

const tile = (label, value, sub = "") => `<div class="tile"><div class="tl">${label}</div><div class="tv">${value}</div>${sub ? `<div class="ts">${sub}</div>` : ""}</div>`;
const section = (title, sub, body) => `<section><h3>${title}</h3>${sub ? `<p class="meta">${sub}</p>` : ""}${body}</section>`;
const legend = items => items ? `<div class="legend">${items.map(([c, l, dash]) => `<span><i style="background:${c}${dash ? ";height:2px;border-top:2px dashed " + c + ";background:none" : ""}"></i>${l}</span>`).join("")}</div>` : "";

function curveTable(b, mass) {
  const keys = [5, 60, 300, 1200, 3600].filter(k => b.has(k));
  return `<div class="kv">${keys.map(k => `<div><div class="tl">${durLong(k)}</div><div class="tv">${b.get(k).w} <small>W</small></div>
    ${mass ? `<div class="ts">${(b.get(k).w / mass).toFixed(2)} W/kg</div>` : ""}</div>`).join("")}</div>`;
}

function zonesHtml(rides) {
  const z = {}; let tot = 0;
  for (const r of rides) for (const [k, v] of Object.entries(r.zones || {})) { z[k] = (z[k] || 0) + v; tot += v; }
  if (!tot) return `<p class="meta">No zone data.</p>`;
  const names = ["Recovery", "Endurance", "Tempo", "Threshold", "VO2 max", "Anaerobic", "Neuromuscular"];
  const max = Math.max(...Object.values(z));
  return `<div class="zones">${names.map((n, i) => {
    const s = z[`Z${i + 1}`] || 0;
    return `<div class="zr"><span class="zl">Z${i + 1} <span class="meta">${n}</span></span>
      <span class="zb"><i style="width:${(s / max * 100).toFixed(1)}%;background:var(--z${i + 1})"></i></span>
      <span class="zv">${s ? hm(s) : "–"}</span><span class="zp">${Math.round(s / tot * 100)} %</span></div>`;
  }).join("")}</div>`;
}

function ridesTable(rides) {
  const f = (v, d = 0) => v == null ? "–" : Number(v).toFixed(d);
  return `<div class="scroll"><table class="rt"><thead><tr><th>Date</th><th>Ride</th><th class="n">Time</th><th class="n">TSS</th>
    <th class="n">NP</th><th class="n">IF</th><th class="n">HR</th><th class="n">EF</th><th class="n">Dec</th></tr></thead><tbody>
    ${[...rides].reverse().map(r => `<tr><td>${dmy(r.d)}</td><td class="nm">${esc(r.name)}${r.completed === false ? " <span class=\"badge part\">Stopped</span>" : ""}</td>
      <td class="n">${hm(r.duration_s)}</td><td class="n">${f(r.tss)}</td><td class="n">${f(r.normalized_power)}</td><td class="n">${f(r.intensity_factor, 2)}</td>
      <td class="n">${f(r.avg_hr)}</td><td class="n">${f(r.efficiency, 2)}</td><td class="n">${r.decoupling_pct == null ? "–" : f(r.decoupling_pct, 1) + " %"}</td></tr>`).join("")}
    </tbody></table></div>`;
}

// ----- tiny SVG chart kit (one y-axis per chart, hover/tap tooltips) -----
const PAD = { l: 40, r: 12, t: 10, b: 24 };
function niceTicks(lo, hi, n = 4) {
  const span = hi - lo || 1, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0);
  const ticks = []; for (let v = Math.floor(lo / step) * step; ; v += step) { ticks.push(+v.toFixed(6)); if (v >= hi - 1e-9) break; }
  return ticks;
}
function frame(W, H, yTicks, y, fmt, xTicks) {
  return yTicks.map(v => `<line class="grid" x1="${PAD.l}" x2="${W - PAD.r}" y1="${y(v)}" y2="${y(v)}"/>
      <text class="ax" x="${PAD.l - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`).join("")
    + xTicks.map(([x, l]) => `<text class="ax" x="${x}" y="${H - 6}" text-anchor="middle">${l}</text>`).join("");
}
// points: [{x, y?, html}] — nearest by x gets a crosshair (line charts) or a ring (dots/bars).
function attachHover(el, svg, H, points, mode) {
  const tip = document.getElementById("tip"), hl = svg.querySelector(".hl");
  const show = ev => {
    const box = svg.getBoundingClientRect(), px = (ev.clientX - box.left) * (svg.viewBox.baseVal.width / box.width);
    let p = null, dmin = Infinity;
    for (const q of points) { const d = Math.abs(q.x - px); if (d < dmin) { dmin = d; p = q; } }
    if (!p || dmin > 40) return hide();
    hl.innerHTML = (mode === "line" ? `<line class="xh" x1="${p.x}" x2="${p.x}" y1="${PAD.t}" y2="${H - PAD.b}"/>` : "")
      + (p.ys || (p.y != null ? [p.y] : [])).map(y => `<circle class="ring" cx="${p.x}" cy="${y}" r="5"/>`).join("");
    tip.innerHTML = p.html; tip.style.display = "block";
    const tw = tip.offsetWidth, vw = document.documentElement.clientWidth;
    tip.style.left = `${Math.max(8, Math.min(vw - tw - 8, ev.clientX - tw / 2))}px`;
    tip.style.top = `${ev.clientY - tip.offsetHeight - 14}px`;
  };
  const hide = () => { hl.innerHTML = ""; tip.style.display = "none"; };
  svg.addEventListener("pointermove", show); svg.addEventListener("pointerdown", show);
  svg.addEventListener("pointerleave", hide); svg.addEventListener("pointercancel", hide);
  window.addEventListener("scroll", hide, { passive: true });
}

function curveChart(el, W, b, bAll, mass) {
  const H = 200, keys = CURVE_D.filter(d => b.has(d) || bAll?.has(d));
  if (keys.length < 2) { el.innerHTML = `<p class="meta">Not enough data.</p>`; return; }
  const vals = [...keys.map(k => b.get(k)?.w), ...keys.map(k => bAll?.get(k)?.w)].filter(Boolean);
  const yt = niceTicks(Math.max(0, Math.min(...vals) * .85), Math.max(...vals));
  const lx0 = Math.log(keys[0]), lx1 = Math.log(keys[keys.length - 1]);
  const x = d => PAD.l + (Math.log(d) - lx0) / (lx1 - lx0) * (W - PAD.l - PAD.r);
  const y = v => PAD.t + (1 - (v - yt[0]) / (yt[yt.length - 1] - yt[0])) * (H - PAD.t - PAD.b);
  const path = m => { const pts = keys.filter(k => m.has(k)); return pts.map((k, i) => `${i ? "L" : "M"}${x(k).toFixed(1)},${y(m.get(k).w).toFixed(1)}`).join(""); };
  const xt = [5, 30, 60, 300, 1200, 3600, 7200, 14400].filter(d => d >= keys[0] && d <= keys[keys.length - 1]).map(d => [x(d), durLabel(d)]);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Power curve">
    ${frame(W, H, yt, y, v => v, xt)}
    ${bAll ? `<path class="ln ref" d="${path(bAll)}"/>` : ""}<path class="ln s1" d="${path(b)}"/><g class="hl"></g></svg>`;
  const pts = keys.map(k => {
    const r = b.get(k), a = bAll?.get(k);
    return { x: x(k), ys: [r && y(r.w), a && y(a.w)].filter(v => v != null), html: `<b>${durLong(k)}</b><br>`
      + (r ? `${r.w} W${mass ? ` · ${(r.w / mass).toFixed(2)} W/kg` : ""}<br><span class="meta">${dmy(r.r.d)} · ${esc(r.r.name)}</span>` : "–")
      + (a && bAll ? `<br>All-time: ${a.w} W <span class="meta">(${dmy(a.r.d)})</span>` : "") };
  });
  attachHover(el, el.querySelector("svg"), H, pts, "line");
}

function loadChart(el, W, rides, from) {
  const H = 160, weeks = new Map();
  for (let d = monday(from); d <= new Date(); d = addDays(d, 7)) weeks.set(iso(d), { d, tss: 0, s: 0, n: 0 });
  for (const r of rides) { const w = weeks.get(iso(monday(r.d))); if (w) { w.tss += Number(r.tss) || 0; w.s += r.duration_s || 0; w.n++; } }
  const list = [...weeks.values()], max = Math.max(50, ...list.map(w => w.tss));
  const yt = niceTicks(0, max * 1.05), top = yt[yt.length - 1];
  const y = v => PAD.t + (1 - v / top) * (H - PAD.t - PAD.b), base = y(0);
  const slot = (W - PAD.l - PAD.r) / list.length, bw = Math.max(2, Math.min(28, slot - 2));
  const cx = i => PAD.l + slot * (i + .5);
  const bars = list.map((w, i) => {
    if (!w.tss) return "";
    const top = y(w.tss), r = Math.min(4, bw / 2, base - top);
    const x0 = cx(i) - bw / 2;
    return `<path class="bar" d="M${x0},${base}V${top + r}Q${x0},${top} ${x0 + r},${top}H${x0 + bw - r}Q${x0 + bw},${top} ${x0 + bw},${top + r}V${base}Z"/>`;
  }).join("");
  const every = Math.ceil(list.length / Math.floor((W - PAD.l) / 48));
  const xt = list.map((w, i) => i % every ? null : [cx(i), dmy(w.d)]).filter(Boolean);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Weekly training load">
    ${frame(W, H, yt, y, v => v, xt)}${bars}<g class="hl"></g></svg>`;
  attachHover(el, el.querySelector("svg"), H, list.map((w, i) => ({ x: cx(i), y: w.tss ? y(w.tss) : null,
    html: `<b>Week of ${dmy(w.d)}</b><br>${Math.round(w.tss)} TSS · ${w.s ? hm(w.s) : "0 min"} · ${w.n} ride${w.n === 1 ? "" : "s"}` })), "bar");
}

function dotChart(el, W, rides, from, val, fmt, refLine) {
  const H = 150;
  if (!rides.length) { el.innerHTML = `<p class="meta">No data.</p>`; return; }
  const vs = rides.map(val), lo = Math.min(...vs, refLine ?? Infinity), hi = Math.max(...vs, refLine ?? -Infinity);
  const pad = (hi - lo) * .15 || Math.abs(hi) * .1 || 1;
  const yt = niceTicks(refLine != null ? Math.min(0, lo) : lo - pad, hi + pad);
  const t0 = +from, t1 = Math.max(+new Date(), t0 + 864e5);
  const x = t => PAD.l + 6 + (t - t0) / (t1 - t0) * (W - PAD.l - PAD.r - 12);
  const y = v => PAD.t + (1 - (v - yt[0]) / (yt[yt.length - 1] - yt[0])) * (H - PAD.t - PAD.b);
  const n = Math.max(2, Math.floor((W - PAD.l) / 70));
  const xt = Array.from({ length: n }, (_, i) => { const t = t0 + (t1 - t0) * i / (n - 1); return [x(t), dmy(new Date(t))]; });
  const ref = refLine != null ? `<line class="refl" x1="${PAD.l}" x2="${W - PAD.r}" y1="${y(refLine)}" y2="${y(refLine)}"/>
    <text class="ax" x="${PAD.l + 4}" y="${y(refLine) - 4}">${fmt(refLine)}</text>` : "";
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">
    ${frame(W, H, yt, y, v => +v.toFixed(2), xt)}${ref}
    ${rides.map(r => `<circle class="dot" cx="${x(+r.d)}" cy="${y(val(r))}" r="4.5"/>`).join("")}<g class="hl"></g></svg>`;
  attachHover(el, el.querySelector("svg"), H, rides.map(r => ({ x: x(+r.d), y: y(val(r)),
    html: `<b>${fmt(val(r))}</b><br>${dmy(r.d)} · ${esc(r.name)}<br><span class="meta">${hm(r.duration_s)}${r.intensity_factor ? ` · IF ${Number(r.intensity_factor).toFixed(2)}` : ""}${r.avg_hr ? ` · HR ${r.avg_hr}` : ""}</span>` })), "dot");
}

let rsz; window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if (view === "perf" && perfData) renderPerf(); }, 200); });

// Reload when the app comes back to the foreground (e.g. after the coach changed the plan).
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && session) load(); });

session = store.get();
session ? load() : renderLogin();
</script>
